    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --accent: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin: auto;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(to right, #c084fc, #f43f5e, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Categorias / Filtros */
        .filters-container {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            justify-content: center;
            width: 100%;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        /* Caixa de Sorteio / Roleta */
        .roulette-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            min-height: 200px;
        }

        .badge-category {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(244, 63, 94, 0.15);
            color: #fb7185;
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .character-display {
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            word-break: break-word;
            transition: transform 0.1s ease, opacity 0.1s ease;
            margin-bottom: 6px;
        }

        .character-universe {
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 400;
            text-align: center;
        }

        /* Botão de Sortear */
        .spin-btn {
            background: linear-gradient(135deg, #f43f5e 0%, #8b5cf6 100%);
            color: white;
            border: none;
            width: 100%;
            max-width: 260px;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 25px rgba(244, 63, 94, 0.3);
            letter-spacing: 0.5px;
        }

        .spin-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(244, 63, 94, 0.4);
        }

        .spin-btn:active {
            transform: translateY(1px);
        }

        .stats {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        footer {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

            { name: "Pantera Negra", universe: "Marvel / Quadrinhos", category: "games" },
            { name: "Wolverine", universe: "Marvel / X-Men", category: "games" },
            { name: "Deadpool", universe: "Marvel / X-Men", category: "games" },
            { name: "Ciclope", universe: "Marvel / X-Men", category: "games" },
            { name: "Tempestade", universe: "Marvel / X-Men", category: "games" },
            { name: "Magneto", universe: "Marvel / X-Men", category: "games" }
        ];

        let currentCategory = 'todos';
        let isSpinning = false;

        const characterNameEl = document.getElementById('characterName');
        const characterUniverseEl = document.getElementById('characterUniverse');
        const badgeCategoryEl = document.getElementById('badgeCategory');
        const spinBtn = document.getElementById('spinBtn');
        const statsInfo = document.getElementById('statsInfo');
        const filterButtons = document.querySelectorAll('.filter-btn');

        // Filtrar personagens com base na categoria ativa
        function getFilteredCharacters() {
            if (currentCategory === 'todos') {
                return characters;
            }
            return characters.filter(c => c.category === currentCategory);
        }

        // Atualizar contadores e estatísticas
        function updateStats() {
            const list = getFilteredCharacters();
            statsInfo.textContent = `Mostrando entre ${list.length} personagens disponíveis nesta categoria`;
        }

        // Lógica dos Botões de Filtro
        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isSpinning) return;
                
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                currentCategory = btn.getAttribute('data-category');
                badgeCategoryEl.textContent = btn.textContent.split(' ')[0];
                updateStats();

                // Resetar visor
                characterNameEl.textContent = "Pronto!";
                characterUniverseEl.textContent = "Gire para escolher";
            });
        });

        // Efeito de Roleta (Sorteio Animado)
        function spinRoulette() {
            if (isSpinning) return;

            const pool = getFilteredCharacters();
            if (pool.length === 0) {
                alert("Nenhum personagem encontrado nesta categoria!");
                return;
            }

            isSpinning = true;
            spinBtn.disabled = true;
            spinBtn.style.opacity = '0.7';

            let counter = 0;
            const totalRounds = 25; // Número de trocas visuais antes de parar
            const speed = 40; // Velocidade da animação

            const interval = setInterval(() => {
                // Sorteia aleatoriamente um personagem temporário para o efeito visual
                const randomIndex = Math.floor(Math.random() * pool.length);
                const tempChar = pool[randomIndex];

                characterNameEl.textContent = tempChar.name;
                characterUniverseEl.textContent = tempChar.universe;
                
                // Efeito sutil de pulso
                characterNameEl.style.transform = `scale(${1 + (Math.random() * 0.1)})`;
                characterNameEl.style.opacity = '0.8';

                counter++;

                if (counter >= totalRounds) {
                    clearInterval(interval);
                    
                    // Escolhe o vencedor final definitivo
                    const finalIndex = Math.floor(Math.random() * pool.length);
                    const finalChar = pool[finalIndex];

                    characterNameEl.textContent = finalChar.name;
                    characterUniverseEl.textContent = finalChar.universe;
                    
                    // Restaura estilo final
                    characterNameEl.style.transform = 'scale(1)';
                    characterNameEl.style.opacity = '1';

                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.style.opacity = '1';
                }
            }, speed);
        }

        spinBtn.addEventListener('click', spinRoulette);

        // Inicializar estatísticas
        updateStats();
    </script>
</body>
</html>
